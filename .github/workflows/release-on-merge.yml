name: Release prepared merge

on:
  pull_request:
    types: [closed]
    paths:
      - .release-prepared.json

permissions: {}

jobs:
  release:
    if: ${{ github.event.pull_request.merged == true }}
    permissions:
      actions: write
      contents: write
      id-token: write
    uses: three-cubes/tc-pipelines/.github/workflows/release-on-merge.yml@07dad612b5f409a975c8356d556b07f3a855597c # v2.2.0
    with:
      merge-sha: ${{ github.event.pull_request.merge_commit_sha }}
      calver-pattern: '^v[0-9]+\.[0-9]+\.[0-9]+$'
      version-file: ""
      release-title: 'three-cubes-fitness $VERSION'
      tag-message: 'three-cubes-fitness $VERSION'
      draft: false
      fan-out-command: ""
