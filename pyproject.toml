[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "three-cubes-fitness"
version = "0.16.1"
description = "Shared architecture-fitness primitives + the single runnable quality gate for Three Cubes repos (kairix, tc-agent-zone): the `tc-fitness run` gate orchestrator (one binary CI and local both invoke), baseline-gating helpers, agent-actionable emit/YAML helpers, the unified ratchet grammar, the catalogue-driven repo-agnostic check runner, and the declarative seam-absorption factories + branch-naming gate."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Three Cubes" }]
keywords = ["fitness-functions", "architecture", "ratchet", "ci", "quality-gate"]
classifiers = [
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]

# Check-contract manifests are a shipped public surface, so their YAML parser
# must be available in every default installation.
dependencies = ["PyYAML>=6.0"]

[project.scripts]
# The single runnable gate. Consumers invoke `uv run tc-fitness run` (local) and
# CI's reusable workflow invokes the same binary — one definition of the gate.
tc-fitness = "tc_fitness.gate:main"
tc-fitness-runtime-contract = "tc_fitness.runtime_contract:main"

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.15,<0.16",
  "mypy>=1.11",
]

[tool.hatch.build.targets.wheel]
packages = ["src/tc_fitness"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers", "-p", "tc_fitness.pytest_tiers"]
markers = [
  "unit: in-process transformation or predicate with no process boundary",
  "contract: public input/output or protocol contract using controlled local collaborators",
  "integration: real package, filesystem, Git or child-process composition",
  "e2e: installed distribution through its supported user entrypoint",
]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
# Pragmatic, security-aware default set. S (bandit) is on so the gate's own
# subprocess use is reviewed; the two genuinely-config-driven subprocess calls in
# gate.py carry inline `# noqa: S603/S602` with a rationale.
select = ["E", "F", "I", "UP", "B", "S", "RUF"]
# E501  — line length is governed by `line-length`, not a hard error.
# RUF022 — the `__all__` lists are grouped by source module with comments
#          (lib / ratchet / catalogue / context / gate / runner), a deliberate
#          readability layout that an isort-style alphabetic sort would destroy.
ignore = ["E501", "RUF022"]

[tool.ruff.lint.per-file-ignores]
# Tests legitimately use `assert`, build synthetic subprocess fixtures, and
# reference tmp paths.
"tests/**" = ["S101", "S108", "S603", "S607", "S404"]
# The runner IS a check dispatcher: launching `bash` / the python interpreter on
# a config-declared script path is its whole job (S603/S607), and its
# type-narrowing `assert cfg.checks_dir is not None` post-`__post_init__` guards
# (S101) are invariants the loader establishes, not input validation.
"src/tc_fitness/runner.py" = ["S101", "S603", "S607"]
# The branch-naming gate shells out to `git` by name (S607) — a fixed, trusted
# argv0, not a partial path under attacker control.
"src/tc_fitness/checks/branch_naming.py" = ["S607"]
# The default file enumeration lists tracked files via `git ls-files` by name
# with a fixed argv0 and the config-declared repo root — the same trusted-argv0
# posture as branch_naming, not input under attacker control (S603/S607).
"src/tc_fitness/fitness_rule.py" = ["S603", "S607"]
# The keystone drift-enders resolve git history (prev-tag, added-files, baseline
# content at a ref) by invoking `git` by name with a fixed argv0 and
# config-declared refs — the same trusted-argv0 posture as branch_naming, not
# input under attacker control (S603/S607).
"src/tc_fitness/keystone.py" = ["S603", "S607"]
# canonical_commit_identity gates commit author/committer metadata by invoking
# `git log` by name with a fixed argv0 and config-declared refs — the same
# trusted-argv0 posture as keystone/branch_naming (S603/S607).
"src/tc_fitness/core_checks/canonical_commit_identity.py" = ["S603", "S607"]
# new_code_coverage resolves the changed-line set by invoking `git merge-base` /
# `git diff` by name with a fixed argv0; the only caller-controlled token (the
# base ref) is validated against a safe-ref charset before use — the same
# trusted-argv0 posture as canonical_commit_identity/branch_naming (S603/S607).
"src/tc_fitness/core_checks/new_code_coverage.py" = ["S603", "S607"]
# contract_change_has_test resolves the changed-FILE set by invoking `git
# merge-base` / `git diff --name-only` by name with a fixed argv0; the only
# caller-controlled token (the base ref) is validated against a safe-ref charset
# before use — the same trusted-argv0 posture as new_code_coverage (S603/S607).
"src/tc_fitness/core_checks/contract_change_has_test.py" = ["S603", "S607"]
# checkov_iac_security runs the trusted `checkov` binary (resolved to an absolute
# path via shutil.which) over the consumer's config-declared scan dir, as a fixed
# argv list with no shell — the same trusted-binary posture the gate itself uses;
# a missing required executable fails closed. The argv is not attacker-controlled
# input (S404 the import, S603 the call).
"src/tc_fitness/core_checks/checkov_iac_security.py" = ["S404", "S603"]
# osv_scanner_sca resolves the trusted scanner executable with shutil.which and
# passes a fixed argv list without a shell. Consumer values are exact versions
# and repo-contained lockfile paths, not executable input.
"src/tc_fitness/core_checks/osv_scanner_sca.py" = ["S404", "S603"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
files = ["src/tc_fitness"]

[tool.coverage.run]
branch = true
source = ["src/tc_fitness"]

[tool.coverage.report]
exclude_lines = []
partial_branches = []

[[tool.mypy.overrides]]
# PyYAML is a required runtime dependency, but does not ship type stubs.
module = ["yaml"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# defusedxml is an OPTIONAL preference: the coverage CORE checks try it for a
# hardened XXE-safe parse and fall back to the stdlib (after an explicit
# DTD/entity rejection) when it is absent, so its stubs are not a hard
# dependency of the type check.
module = ["defusedxml", "defusedxml.*"]
ignore_missing_imports = true

# ── tc-fitness gate declaration — the engine eats its own dog food ───────────
# The engine runs THROUGH the gate it ships: `uv run tc-fitness run` reads this
# block and runs the engine's own quality gate (ruff / format / mypy / pytest)
# plus its own branch-naming module — the SAME binary both CI and a local run
# invoke, so local == CI by construction. ci.yml's `check` matrix job shrinks to
# `setup-uv-cached → uv run tc-fitness run`, keeping the py3.12/3.13 matrix
# caller-side while the gate's STEPS live here as config, never hand-copied YAML.
[tool.tc_fitness]
name = "three-cubes-fitness self gate"

# ruff lint over the package + tests — the engine's own source style gate.
[[tool.tc_fitness.steps]]
id = "ruff"
summary = "ruff check src tests"
run = ["ruff", "check", "src", "tests"]
fix = "run `ruff check --fix src tests`"
next = "re-run `tc-fitness run`"

# Preparation formats the complete Python source and test trees. Evaluation
# verifies the same complete surface.
[[tool.tc_fitness.steps]]
id = "ruff-format"
summary = "ruff format --check src tests"
run = ["ruff", "format", "--check", "src", "tests"]
fix = "run `make prepare`"
next = "re-run `make check`"

# mypy --strict over the package. `strict = true` + `files = ["src/tc_fitness"]`
# live in [tool.mypy], so a bare `mypy` is already the strict, scoped check.
# Dropped from the `--staged` <60s smoke (skip_when_staged): a whole-package
# strict type check is a full-tree leg, not a per-staged-file smoke. The full
# `tc-fitness run` (CI + the merge bar) still runs it.
[[tool.tc_fitness.steps]]
id = "mypy"
summary = "mypy --strict src/tc_fitness"
run = ["mypy"]
skip_when_staged = true
fix = "resolve the type error mypy reports"
next = "re-run `tc-fitness run`"

# pytest with coverage — the engine's self-test suite, producing fresh XML/JSON
# and an exact-source receipt at the declared external attempt path. Dropped from
# the `--staged` <60s smoke (skip_when_staged): the full coverage run is the
# expensive full-tree leg the smoke deliberately defers to the merge gate.
[[tool.tc_fitness.steps]]
id = "pytest"
summary = "pytest with fresh exact-source coverage receipt"
run = ["python", "-m", "tc_fitness.coverage_admission", "produce", "--base-commit", "env:TC_FITNESS_BASE_COMMIT", "--candidate-commit", "env:TC_FITNESS_CANDIDATE_COMMIT", "--source", "src/tc_fitness", "--config", "pyproject.toml", "--run-id", "env:TC_FITNESS_RUN_ID", "--attempt-id", "env:TC_FITNESS_ATTEMPT_ID", "--output", "env:TC_FITNESS_COVERAGE_OUTPUT", "--digest-output", "env:TC_FITNESS_COVERAGE_DIGEST_FILE", "--", "-m", "pytest", "-q"]
skip_when_staged = true
fix = "fix the failing test or the code under test"
next = "re-run `tc-fitness run`"

# The engine's OWN branch-naming gate, run against the gate. branch_naming is an
# engine-shipped module (`tc_fitness.checks.branch_naming`) with a `python -m`
# entrypoint; it gates the LIVE branch name (not a per-file baseline), so it is
# not a `core:`/FitnessRule check — the faithful binding is its module
# entrypoint. The engine thus dogfoods its own convention check.
[[tool.tc_fitness.steps]]
id = "branch-naming"
summary = "branch_naming (engine's own convention gate)"
run = ["python", "-m", "tc_fitness.checks.branch_naming"]
fix = "rename the branch to the Linear <user>/<team>-<number>-<slug> shape"
next = "re-run `tc-fitness run`"

# Evidence is never optional: absent exact-base receipts fail this catalogue.
[[tool.tc_fitness.steps]]
id = "coverage-assurance"
summary = "exact-source coverage floors and accepted-base ratchet"
catalogue = "tc_fitness.coverage_catalogue:ENTRIES"
baseline_free = true
fix = "produce current coverage evidence, supply the trusted accepted-base digest, and cover all findings"
next = "re-run `tc-fitness run`"

[tool.tc_fitness.core_checks.coverage_includes_branches]
coverage_report = "env:TC_FITNESS_COVERAGE_REPORT"

[tool.tc_fitness.core_checks.coverage_floor]
roots = ["src/tc_fitness"]
floor_pct = 95
branch_floor_pct = 95
critical_branch_files = ["src/tc_fitness/gate.py", "src/tc_fitness/runner.py", "src/tc_fitness/gate_config.py", "src/tc_fitness/runtime_contract.py"]
coverage_report = "env:TC_FITNESS_COVERAGE_REPORT"
coverage_config = "pyproject.toml"
coverage_receipt = "env:TC_FITNESS_COVERAGE_RECEIPT"
coverage_receipt_digest = "file:env:TC_FITNESS_COVERAGE_DIGEST_FILE"
accepted_coverage_receipt = "env:TC_FITNESS_ACCEPTED_COVERAGE_RECEIPT"
accepted_coverage_digest = "env:TC_FITNESS_ACCEPTED_COVERAGE_DIGEST"
exact_base_commit = "env:TC_FITNESS_BASE_COMMIT"
candidate_commit = "env:TC_FITNESS_CANDIDATE_COMMIT"
run_id = "env:TC_FITNESS_RUN_ID"
attempt_id = "env:TC_FITNESS_ATTEMPT_ID"
max_age_seconds = 3600

[tool.tc_fitness.core_checks.new_code_coverage]
roots = ["src/tc_fitness"]
floor_pct = 100
coverage_report = "env:TC_FITNESS_COVERAGE_REPORT"
coverage_config = "pyproject.toml"
coverage_receipt = "env:TC_FITNESS_COVERAGE_RECEIPT"
coverage_receipt_digest = "file:env:TC_FITNESS_COVERAGE_DIGEST_FILE"
accepted_coverage_receipt = "env:TC_FITNESS_ACCEPTED_COVERAGE_RECEIPT"
accepted_coverage_digest = "env:TC_FITNESS_ACCEPTED_COVERAGE_DIGEST"
exact_base_commit = "env:TC_FITNESS_BASE_COMMIT"
candidate_commit = "env:TC_FITNESS_CANDIDATE_COMMIT"
run_id = "env:TC_FITNESS_RUN_ID"
attempt_id = "env:TC_FITNESS_ATTEMPT_ID"
max_age_seconds = 3600
