schema: tc.fitness/check-contract/v1
check: core:new_code_coverage
config:
  roots:
  - src
  floor_pct: 90
  coverage_report: reports/new-lines.xml
  base_ref: refs/heads/base
cases:
- id: compliant
  fixture: compliant
  environment:
    schema: tc.fitness/check-environment/v2
    path: inherit
    git:
      schema: tc.fitness/git-fixture/v1
      history: .contract/git.fast-import
      checkout: refs/heads/candidate
  expected:
    status: pass
    exit: zero
    findings: []
- id: violation
  fixture: violation
  environment:
    schema: tc.fitness/check-environment/v2
    path: inherit
    git:
      schema: tc.fitness/git-fixture/v1
      history: .contract/git.fast-import
      checkout: refs/heads/candidate
  expected:
    status: fail
    exit: nonzero
    findings:
    - rule: new-code-coverage
      path: src/example.py
      message_contains: below
- id: unavailable
  fixture: unavailable
  environment:
    schema: tc.fitness/check-environment/v2
    path: empty
    git:
      schema: tc.fitness/git-fixture/v1
      history: .contract/git.fast-import
      checkout: refs/heads/candidate
  expected:
    status: error
    exit: nonzero
    findings:
    - rule: check-execution-error
      path: .
      message_contains: FileNotFoundError
dependencies:
- git
